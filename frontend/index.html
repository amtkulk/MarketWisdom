    <!-- PWA Service Worker: register + auto-reload when a new version activates -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            // If a new SW is waiting, tell it to activate immediately.
            const promptUpdate = (worker) => {
              if (!worker) return;
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                worker.postMessage({ type: 'SKIP_WAITING' });
              }
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  worker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            };
            if (reg.waiting) promptUpdate(reg.waiting);
            reg.addEventListener('updatefound', () => promptUpdate(reg.installing));
            // When the new SW takes control, reload the page so fresh JS is used.
            let reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (!reloaded) { reloaded = true; window.location.reload(); }
            });
          } catch (err) {
            console.log('ServiceWorker registration failed:', err);
          }
        });
      }
    </script>
